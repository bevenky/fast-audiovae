[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "fast-audiovae"
version = "0.1.0"
description = "CPU inference optimizations for AudioVAE2"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26", "onnxruntime==1.29.0", "onnx==1.22.0"]

[project.urls]
Repository = "https://github.com/bevenky/fast-audiovae"

[project.optional-dependencies]
encoder = ["torch>=2.8"]
test = ["pytest>=8"]

[project.scripts]
fast-audiovae = "fast_audiovae.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["native: requires a built platform-specific CPU library"]
