[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fast-audiovae"
version = "0.1.0"
description = "CPU inference optimizations for AudioVAE2"
requires-python = ">=3.10"
dependencies = ["numpy>=1.26", "onnxruntime==1.29.0", "onnx==1.19.1"]

[project.optional-dependencies]
encoder = ["torch>=2.8"]
test = ["pytest>=8"]

[project.scripts]
fast-audiovae = "fast_audiovae.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["native: requires a built platform-specific CPU library"]
